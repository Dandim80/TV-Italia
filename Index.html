<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>IPTV Canali Italiani</title>
  <script src="https://vjs.zencdn.net/8.5.2/video.min.js"></script>
  <link href="https://vjs.zencdn.net/8.5.2/video-js.css" rel="stylesheet" />
  <style>
    body { font-family: sans-serif; text-align: center; background: #111; color: #fff; }
    select, video { width: 90%; max-width: 800px; margin-top: 20px; }
    video { height: auto; }
  </style>
</head>
<body>
  <h1>Canali IPTV Italiani</h1>
  <select id="canali" onchange="cambiaCanale()">
    <option>Seleziona un canale...</option>
  </select>

  <video id="player" class="video-js vjs-default-skin" controls autoplay preload="auto"></video>

  <script>
    const listaUrl = "https://iptv-org.github.io/iptv/index.m3u";

    fetch(listaUrl)
      .then(res => res.text())
      .then(data => {
        const righe = data.split("#EXTINF:-1");
        const canali = righe.slice(1).map(riga => {
          const [info, url] = riga.trim().split("\n");
          const nome = info.match(/,(.*)/)?.[1] || "Senza nome";
          return { nome, url };
        });

        const select = document.getElementById("canali");
        canali.forEach(({ nome, url }) => {
          const option = document.createElement("option");
          option.value = url;
          option.textContent = nome;
          select.appendChild(option);
        });
      });

    function cambiaCanale() {
      const player = videojs("player");
      const url = document.getElementById("canali").value;
      player.src({ src: url, type: "application/x-mpegURL" });
      player.play();
    }
  </script>
</body>
</html>
